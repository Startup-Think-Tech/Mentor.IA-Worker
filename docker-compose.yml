services:
  insights-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_INSIGHTS_QUEUE: ${RABBITMQ_INSIGHTS_QUEUE}
      RABBITMQ_INSIGHTS_DLQ: ${RABBITMQ_INSIGHTS_DLQ}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
      RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH}
      RABBITMQ_PUBLISH_TIMEOUT_MS: ${RABBITMQ_PUBLISH_TIMEOUT_MS}
      AI_PROVIDER: ${AI_PROVIDER}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL}
      AI_MODEL: ${AI_MODEL}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS}
      INSIGHT_PROCESSING_LEASE_SECONDS: ${INSIGHT_PROCESSING_LEASE_SECONDS}
      INSIGHT_MAX_ATTEMPTS: ${INSIGHT_MAX_ATTEMPTS}
      INSIGHT_RETRY_POLL_INTERVAL_MS: ${INSIGHT_RETRY_POLL_INTERVAL_MS}
      INSIGHT_RETRY_BATCH_SIZE: ${INSIGHT_RETRY_BATCH_SIZE}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE}
      OUTBOX_LOCK_SECONDS: ${OUTBOX_LOCK_SECONDS}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS}
    restart: unless-stopped
