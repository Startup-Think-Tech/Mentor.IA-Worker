services:
  insights-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_INSIGHTS_QUEUE: ${RABBITMQ_INSIGHTS_QUEUE}
      RABBITMQ_INSIGHTS_DLQ: ${RABBITMQ_INSIGHTS_DLQ}
      AI_PROVIDER: ${AI_PROVIDER}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY}
      AI_MODEL: ${AI_MODEL}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS}
      INSIGHT_MAX_ATTEMPTS: ${INSIGHT_MAX_ATTEMPTS}
      INSIGHT_RETRY_POLL_INTERVAL_MS: ${INSIGHT_RETRY_POLL_INTERVAL_MS}
      INSIGHT_RETRY_BATCH_SIZE: ${INSIGHT_RETRY_BATCH_SIZE}
    restart: unless-stopped
